server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # TTS/audio and JSON APIs must reach the backend, otherwise the SPA
    # fallback answers 200 with HTML and the app silently loses the API.
    # NOTE: resolver + variable => nginx resolves "backend" per-request,
    # so frontend can start even if backend is still booting (no emerg exit).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $upstream_backend backend:8000;
    location /api/ {
        proxy_pass         http://$upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_read_timeout 420s;
        proxy_send_timeout 420s;
        proxy_connect_timeout 15s;
        client_max_body_size 25m;
    }

    # Hashed build assets never change under the same name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}